  <text x="637" y="743" class="body">Storage · Additional Logistics</text>
  <text x="637" y="765" class="small">FluidLogistics: multi-fluid storage and transport</text>
  <rect x="573" y="793" width="604" height="91" rx="10" class="box"/>
  <use href="#gear" x="590" y="813" style="color:#7854a6"/>
  <text x="637" y="823" class="name">Enchantment / processing</text>
  <text x="637" y="849" class="body">Dragons Plus → Enchantment Industry</text>
