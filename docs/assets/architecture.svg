<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" role="img" aria-labelledby="title desc">
  <title id="title">Create263 Pack architecture</title>
  <desc id="desc">Minecraft 26.3, NeoForge 26.3.0.22-beta and Java 25 support a Create bundle containing Ponder, Catnip, Flywheel and Registrate. Sable provides physics to Simulated; Offroad and Aeronautics build on Simulated. Other addon groups cover railways, power, mining, storage, logistics and enchantment. This original diagram shows selected dependencies, not the complete mod graph.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#64748b"/></marker>
    <g id="gear" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="16" cy="16" r="9"/><circle cx="16" cy="16" r="3.5"/><path d="M16 1v5m0 20v5M1 16h5m20 0h5M5.4 5.4l3.5 3.5m14.2 14.2 3.5 3.5M5.4 26.6l3.5-3.5M23.1 8.9l3.5-3.5"/></g>
    <g id="rail" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 2-4 28M23 2l4 28M8 7h16M7 14h18M6 21h20M5 28h22"/></g>
    <g id="flight" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 2v27m0-20L2 19l14-3 14 3L16 9Zm0 14-7 6 7-2 7 2-7-6Z"/></g>
    <g id="storage" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M3 7h26v22H3ZM3 7l5-5h16l5 5M3 14h26M12 18h8v4h-8Z"/></g>
    <g id="bolt" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M19 2 6 18h10l-3 12 14-18H17Z"/></g>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172b45}.heading{font-size:27px;font-weight:700}.section{font-size:21px;font-weight:700}.name{font-size:20px;font-weight:700}.body{font-size:17px}.small{font-size:15px;fill:#52647b}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}.box{fill:#fff;stroke:#d3dfec;stroke-width:1.5}.pill{fill:#edf4fc;stroke:#b9cee7;stroke-width:1.2}
    </style>
  </defs>
