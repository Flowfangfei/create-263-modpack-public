plugins { id 'java-library'; id 'net.neoforged.moddev' }
apply from: rootProject.file('gradle/neoforge-module.gradle')
dependencies { api project(':simulated'); implementation project(':offroad') }

// All 32 local envelope items receive native COOKING_FUEL defaults in AeroBlocks.
