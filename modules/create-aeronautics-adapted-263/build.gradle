plugins {
    id 'base'
    id 'net.neoforged.moddev' version '2.0.148' apply false
}
group = 'dev.simulated_team'
version = '1.3.0-adapted.1'
allprojects {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.blamejared.com/' }
        maven { url = 'https://maven.ryanhcode.dev/releases' }
        maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    }
}

ext.adaptedAccessTransformers = files(
    '../sable-adapted-263/src/neoforge/resources/META-INF/accesstransformer.cfg',
    '../steam-n-rails-263/tooling/create-adapted/create-accesstransformer.cfg',
    'simulated/src/neoforge/resources/META-INF/accesstransformer.cfg',
    'offroad/src/neoforge/resources/META-INF/accesstransformer.cfg',
    'aeronautics/src/neoforge/resources/META-INF/accesstransformer.cfg'
)
