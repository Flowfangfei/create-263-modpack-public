plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
apply from: '../../gradle/create263-addon.gradle'

dependencies {
    compileOnly files('../sable-adapted-263/build/libs/sable-neoforge-26.3-3.0.0-adapted.1.jar')
    compileOnly files('../create-aeronautics-adapted-263/simulated/build/libs/simulated-neoforge-26.3-1.3.0-adapted.1.jar')
}
sourceSets {
    verification {
        compileClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
}
tasks.register('verifyHydraulicLengthControl', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aerouniversaljoint.verification.HydraulicLengthControlRegressionCheck'
}
tasks.register('verifyCompatibilityContract', JavaExec) {
    group = 'verification'
    dependsOn tasks.named('verificationClasses')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.enxv.aerouniversaljoint.verification.CompatibilityContractRegressionCheck'
}
tasks.named('check') {
    dependsOn 'verifyHydraulicLengthControl', 'verifyCompatibilityContract'
}

tasks.withType(Jar).configureEach {
    from('LICENSE.md') { into 'META-INF'; rename { 'LICENSE_UPSTREAM_LEGACY.md' } }
}
