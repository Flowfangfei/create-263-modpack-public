plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

sourceSets { simulated }
sourceSets.simulated.compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
sourceSets.simulated.runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath

// Java version target
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NFRT 2.0.31 includes JST 2.0.11's fix for anonymous-class access transformers.
// Earlier JST leaves HolderSet$1.contents protected after widening Named.contents.
neoFormRuntime {
    version = '2.0.31'
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    if (parchment_version != 'none') {
        parchment {
            mappingsVersion = parchment_version
            minecraftVersion = parchment_minecraft_version
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG

            //Allows for reloading the project during runtime with compatible jvm
            jvmArgument "-XX:+IgnoreUnrecognizedVMOptions"
            jvmArgument "-XX:+AllowEnhancedClassRedefinition"
        }

        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()

            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            type = "serverData"

            gameDirectory = project.file('run-data')
            // Keep migration runs from replacing the checked-in generated assets.
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('build/generated/runData/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('src/generated/resources/').getAbsolutePath(), '--existing-mod', 'create', '--existing-mod', 'simulated', '--existing-mod', 'dye_depot'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Real APIs are source-built by the root integration build; no author-specific launcher paths.
repositories {
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.blamejared.com/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
}
def sharedCreate = file('../steam-n-rails-263/tooling/create-adapted/libs')
def simulatedApi = file('../create-aeronautics-adapted-263/simulated/build/libs/simulated-neoforge-26.3-1.3.0-adapted.1.jar')
def sableApi = file('../sable-adapted-263/build/libs/sable-neoforge-26.3-3.0.0-adapted.1.jar')
dependencies {
    compileOnly fileTree(sharedCreate) { include '*.jar' }
    compileOnly 'mezz.jei:jei-26.3-neoforge:31.3.0.16'
    compileOnly('me.shedaniel:RoughlyEnoughItems-neoforge:26.3.823') { transitive = false }
    compileOnly('dev.architectury:architectury-neoforge:22.0.3') { transitive = false }
    compileOnly 'org.jetbrains:annotations:26.1.0'
    simulatedCompileOnly files(simulatedApi, sableApi)
}
tasks.register('verifyAdaptedDependencies') {
    doLast {
        if (!sharedCreate.isDirectory() || fileTree(sharedCreate).matching { include '*.jar' }.isEmpty())
            throw new GradleException('Build/stage the root Create development APIs first.')
    }
}
tasks.register('requireSimulatedDependency') {
    dependsOn 'verifyAdaptedDependencies'
    doLast { if (!simulatedApi.isFile() || !sableApi.isFile()) throw new GradleException('Build the actual Simulated/Sable modules before simulatedJar.') }
}
tasks.named('compileJava') { dependsOn 'verifyAdaptedDependencies' }
tasks.named('compileSimulatedJava') { dependsOn 'requireSimulatedDependency' }

// Expands all declared replace properties in the specified resource targets.
processResources {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    filteringCharset = 'UTF-8'

    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version       : neoforge_version,
            neoforge_version_range : neoforge_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('processSimulatedResources') {
    dependsOn tasks.named('requireSimulatedDependency')
    def bridgeProperties = [loader_version_range: loader_version_range,
            mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors,
            minecraft_version_range: minecraft_version_range, neoforge_version_range: neoforge_version_range]
    inputs.properties bridgeProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand bridgeProperties }
}

tasks.register('simulatedJar', Jar) {
    group = 'build'
    description = 'Build the optional Simulated bridge with its real 26.3 dependency.'
    archiveClassifier = 'simulated'
    from sourceSets.simulated.output
    from 'LICENSE'
}

java.withSourcesJar()
tasks.named('sourcesJar') { from 'LICENSE'; duplicatesStrategy(DuplicatesStrategy.EXCLUDE) }
tasks.register('simulatedSourcesJar', Jar) {
    group = 'build'
    archiveClassifier = 'simulated-sources'
    from sourceSets.simulated.allSource
    from 'LICENSE'
}

// Get properties into the manifest for reading at runtime.
jar {
    from 'LICENSE'
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Build-Origin': 'Create263 Pack source integration'
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xmaxerrs', '1000', '-Xmaxwarns', '3'])
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

wrapper {
    gradleVersion = '9.5.0'
    distributionType = Wrapper.DistributionType.BIN
}
