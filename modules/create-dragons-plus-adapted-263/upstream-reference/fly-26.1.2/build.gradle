plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java-library'
    id 'maven-publish'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_artifact_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
    }
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file('src/main/resources/create_dragons_plus.accesswidener')

    mods {
        create_dragons_plus {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            client()
            name 'Create: Dragons Plus Client'
        }
        server {
            server()
            name 'Create: Dragons Plus Server'
            programArg '--nogui'
        }
        datagen {
            inherit client
            name 'Create: Dragons Plus Data Generation'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg "-Dfabric-api.datagen.modid=${mod_id}"
            vmArg "-Dcreate_dragons_plus.project-dir=${project.projectDir.absolutePath}"
            runDir 'build/datagen'
        }
    }
}

sourceSets {
    apiTest {
        java.srcDir 'src/apiTest/java'
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    api("maven.modrinth:create-fly:${create_fly_version}") { transitive = false }

    clientCompileOnly "maven.modrinth:jei:${jei_version}"
    clientRuntimeOnly "maven.modrinth:jei:${jei_version}"

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "net.fabricmc:fabric-loader-junit:${loader_version}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'loader_version', loader_version
    inputs.property 'fabric_api_version', fabric_api_version
    inputs.property 'create_version_range', create_version_range
    inputs.property 'jei_version', jei_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: minecraft_version,
                loader_version: loader_version,
                fabric_api_version: fabric_api_version,
                create_version_range: create_version_range,
                jei_version: jei_version
        )
    }

    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/accesstransformer.cfg'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from 'LICENSING.txt'
    from 'LICENSE.txt'
    from 'LICENSE-CREATE.txt'
    exclude '.cache'
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/client/java/**/*.java', 'src/test/java/**/*.java', 'src/apiTest/java/**/*.java'
        endWithNewline()
        leadingTabsToSpaces()
        removeUnusedImports()
        toggleOffOn()
        importOrder()
        eclipse().configFile 'codeformat/formatter-config.xml'
        licenseHeaderFile 'codeformat/HEADER.txt'
    }
}

tasks.named('build').configure {
    dependsOn tasks.named('spotlessCheck')
    dependsOn tasks.named('compileApiTestJava')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = "${mod_artifact_id}-${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'DragonsPlus'
            url = 'https://maven.dragons.plus/releases'
            credentials(PasswordCredentials)
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

publishMods {
    file = jar.archiveFile
    additionalFiles.from sourcesJar.archiveFile
    changelog = providers.fileContents(layout.projectDirectory.file('CHANGELOG.md')).asText
    version = mod_version
    type = STABLE
    displayName = "Create: Dragons Plus ${mod_version} for Create-Fly ${create_fly_version}"
    modLoaders.add('fabric')

    curseforge {
        projectId = '1216624'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('create-fly')
        client = true
        server = true
    }

    modrinth {
        projectId = 'dzb1a5WV'
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        minecraftVersions.add(minecraft_version)
        requires('create-fly')
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
